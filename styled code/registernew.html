<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register — StoneVista</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/hero.css">
  <style>
    /* ── Extra styles for OTP flow ── */
    .phone-row {
      display: flex; gap: 10px; align-items: flex-end;
    }
    .phone-row .field-group { flex: 1; margin-bottom: 0; }

    .btn-otp {
      flex-shrink: 0;
      padding: 0 18px;
      height: 46px;
      background: transparent;
      color: var(--gold-line);
      border: 1px solid rgba(200,184,154,0.35);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500; letter-spacing: .5px;
      cursor: none; white-space: nowrap;
      transition: background .2s, border-color .2s;
    }
    .btn-otp:hover { background: rgba(200,184,154,0.08); border-color: var(--gold-line); }
    .btn-otp:disabled { opacity: .4; pointer-events: none; }
    .btn-otp.sent { color: var(--success); border-color: rgba(94,204,123,0.4); background: rgba(94,204,123,0.05); }

    /* OTP boxes */
    .otp-group { display: none; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .otp-group.visible { display: flex; }

    .otp-boxes { display: flex; gap: 10px; }
    .otp-box {
      flex: 1; height: 52px;
      text-align: center; font-size: 22px; font-weight: 500;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: var(--white);
      font-family: 'DM Sans', sans-serif;
      outline: none; caret-color: var(--gold-line);
      transition: border-color .2s, box-shadow .2s;
    }
    .otp-box:focus { border-color: rgba(200,184,154,.5); box-shadow: 0 0 0 3px rgba(200,184,154,.08); }

    .otp-hint {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--mid);
    }
    .btn-resend {
      font-size: 11px; color: var(--silver); background: none; border: none;
      cursor: none; text-decoration: underline; font-family: 'DM Sans', sans-serif;
      transition: color .2s;
    }
    .btn-resend:hover { color: var(--white); }
    .btn-resend:disabled { opacity: .4; pointer-events: none; }

    /* Inline error message */
    .inline-error {
      font-size: 12px; color: var(--error);
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 8px; padding: 9px 14px;
      margin-bottom: 16px; display: none;
    }
    .inline-error.visible { display: block; }

    /* Step dots */
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background .3s, width .3s, border-radius .3s;
    }
    .step-dot.active { background: var(--gold-line); width: 20px; border-radius: 3px; }
    .step-dot.done   { background: rgba(94,204,123,0.5); }
  </style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<!-- NAVBAR -->
<nav>
  <a class="brand" href="/">Stone<em>Vista</em></a>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  <div class="nav-links" id="nav-links">
    <a href="/#about">About</a>
    <a href="/#offer">Features</a>
    <a href="/#process">How It Works</a>
    <a href="/login">Sign In</a>
    <a href="/register" class="nav-cta">Get Started</a>
  </div>
</nav>

<!-- REGISTER FORM -->
<div class="page-body form-page">
  <div class="form-card reveal">

    <!-- Step dots -->
    <div class="step-dots">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3"></div>
    </div>

    <p class="form-eyebrow" id="card-eyebrow">Create Your Account</p>
    <div class="rule"></div>
    <h1 class="form-title" id="card-title">Join<br><em>StoneVista</em></h1>
    <p class="form-subtitle" id="card-sub">Set up your seller profile and start reaching global stone buyers.</p>

    <!-- Inline error -->
    <div class="inline-error" id="inline-error"></div>

    <!-- Shop Name -->
    <div class="field-group" id="field-shop">
      <label class="field-label" for="shop_name">Shop / Business Name</label>
      <input type="text" class="field-input" id="shop_name"
             placeholder="e.g. Sharma Marble Works" autocomplete="organization">
    </div>

    <!-- Your Name -->
    <div class="field-group" id="field-name">
      <label class="field-label" for="name">Your Full Name</label>
      <input type="text" class="field-input" id="name"
             placeholder="e.g. Rajiv Sharma" autocomplete="name">
    </div>

    <!-- Phone + Send OTP button -->
    <div class="phone-row" id="field-phone">
      <div class="field-group">
        <label class="field-label" for="phone">Mobile Number</label>
        <input type="tel" class="field-input" id="phone"
               placeholder="+91 98765 43210" autocomplete="tel" maxlength="15">
      </div>
      <button type="button" class="btn-otp" id="btn-send-otp">Send OTP</button>
    </div>

    <!-- OTP digit boxes (hidden until OTP sent) -->
    <div class="otp-group" id="otp-group">
      <label class="field-label">Enter 6-Digit OTP</label>
      <div class="otp-boxes">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp1">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp2">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp3">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp4">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp5">
        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" id="otp6">
      </div>
      <div class="otp-hint">
        <span>Expires in <strong id="otp-timer">2:00</strong></span>
        <button type="button" class="btn-resend" id="btn-resend" disabled>Resend OTP</button>
      </div>
    </div>

    <!-- Verify button (shown after OTP sent) -->
    <button type="button" class="btn-form-primary" id="btn-verify" style="display:none;">
      Verify &amp; Continue →
    </button>

    <!-- Send OTP acts as "Next" before OTP is sent -->
    <button type="button" class="btn-form-primary" id="btn-next">
      Send OTP
    </button>

    <div class="form-divider"><span>or</span></div>
    <a href="/login" class="btn-form-ghost">Sign In to Existing Account</a>

  </div>
</div>

<script>
  /* ── Cursor ── */
  const cursor = document.getElementById('cursor');
  const ring   = document.getElementById('cursor-ring');
  let mx=0, my=0, rx=0, ry=0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
  });
  (function animateRing() {
    rx += (mx-rx)*.12; ry += (my-ry)*.12;
    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    requestAnimationFrame(animateRing);
  })();

  /* ── Hamburger ── */
  const ham  = document.getElementById('hamburger');
  const menu = document.getElementById('nav-links');
  ham.addEventListener('click', () => { ham.classList.toggle('open'); menu.classList.toggle('open'); });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { ham.classList.remove('open'); menu.classList.remove('open'); }));

  /* ── Reveal ── */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(r => io.observe(r));

  /* ── Refs ── */
  const errBox    = document.getElementById('inline-error');
  const btnNext   = document.getElementById('btn-next');
  const btnVerify = document.getElementById('btn-verify');
  const otpGroup  = document.getElementById('otp-group');
  const otpBoxes  = document.querySelectorAll('.otp-box');
  const timerEl   = document.getElementById('otp-timer');
  const btnResend = document.getElementById('btn-resend');
  const dot1 = document.getElementById('dot-1');
  const dot2 = document.getElementById('dot-2');
  const dot3 = document.getElementById('dot-3');

  let timerInterval = null;

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('visible');
  }
  function clearError() {
    errBox.textContent = '';
    errBox.classList.remove('visible');
  }

  /* ── OTP Timer ── */
  function startTimer() {
    let t = 120;
    btnResend.disabled = true;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      t--;
      const m = Math.floor(t/60), s = t%60;
      timerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
      if (t <= 0) {
        clearInterval(timerInterval);
        timerEl.textContent = 'Expired';
        btnResend.disabled = false;
      }
    }, 1000);
  }

  /* ── OTP Boxes: auto-advance & paste ── */
  otpBoxes.forEach((box, idx) => {
    box.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
      if (e.target.value && idx < otpBoxes.length - 1) otpBoxes[idx+1].focus();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && idx > 0) otpBoxes[idx-1].focus();
    });
    box.addEventListener('paste', e => {
      e.preventDefault();
      const digits = (e.clipboardData || window.clipboardData)
                       .getData('text').replace(/\D/g,'').slice(0,6);
      digits.split('').forEach((ch, i) => { if(otpBoxes[i]) otpBoxes[i].value = ch; });
      const next = Math.min(digits.length, 5);
      otpBoxes[next].focus();
    });
  });

  function getOTP() {
    return Array.from(otpBoxes).map(b => b.value).join('');
  }

  /* ── SEND OTP ── */
  async function doSendOtp() {
    clearError();
    const shop_name = document.getElementById('shop_name').value.trim();
    const name      = document.getElementById('name').value.trim();
    const phone     = document.getElementById('phone').value.trim();

    if (!shop_name) { showError('Please enter your shop name.'); return; }
    if (!name)      { showError('Please enter your full name.'); return; }
    if (!phone)     { showError('Please enter your mobile number.'); return; }

    btnNext.disabled    = true;
    btnNext.textContent = 'Sending…';

    try {
      const res  = await fetch('/send_otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ shop_name, name, phone })
      });
      const data = await res.json();

      if (!data.success) {
        showError(data.error || 'Could not send OTP. Please try again.');
        btnNext.disabled    = false;
        btnNext.textContent = 'Send OTP';
        return;
      }

      // OTP sent — switch UI
      btnNext.style.display   = 'none';
      btnVerify.style.display = 'block';
      otpGroup.classList.add('visible');

      dot1.classList.remove('active'); dot1.classList.add('done');
      dot2.classList.remove('active'); dot2.classList.add('done');
      dot3.classList.add('active');

      document.getElementById('card-eyebrow').textContent = 'Verify Your Number';
      document.getElementById('card-title').innerHTML = 'Enter the<br><em>OTP sent</em>';
      document.getElementById('card-sub').textContent =
        `We sent a 6-digit code to ${phone}. Check your messages.`;

      // Lock fields
      ['shop_name','name','phone'].forEach(id => document.getElementById(id).disabled = true);

      startTimer();
      otpBoxes[0].focus();

    } catch(err) {
      showError('Network error. Please try again.');
      btnNext.disabled    = false;
      btnNext.textContent = 'Send OTP';
    }
  }

  /* ── VERIFY OTP → redirect to /payment ── */
  async function doVerifyOtp() {
    clearError();
    const otp = getOTP();

    if (otp.length < 6) { showError('Please enter all 6 digits.'); return; }

    btnVerify.disabled    = true;
    btnVerify.textContent = 'Verifying…';

    try {
      const res  = await fetch('/verify_otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ otp })
      });
      const data = await res.json();

      if (!data.success) {
        showError(data.error || 'Incorrect OTP. Please try again.');
        btnVerify.disabled    = false;
        btnVerify.textContent = 'Verify & Continue →';
        otpBoxes.forEach(b => b.value = '');
        otpBoxes[0].focus();
        return;
      }

      // ✅ Verified — go to payment page
      clearInterval(timerInterval);
      btnVerify.textContent = 'Verified ✓';
      window.location.href  = data.redirect;   // '/payment'

    } catch(err) {
      showError('Network error. Please try again.');
      btnVerify.disabled    = false;
      btnVerify.textContent = 'Verify & Continue →';
    }
  }

  btnNext.addEventListener('click', doSendOtp);
  btnVerify.addEventListener('click', doVerifyOtp);

  /* Resend */
  btnResend.addEventListener('click', async () => {
    otpBoxes.forEach(b => b.value = '');
    clearError();
    const phone = document.getElementById('phone').value.trim();
    const res   = await fetch('/send_otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        shop_name: document.getElementById('shop_name').value.trim(),
        name:      document.getElementById('name').value.trim(),
        phone
      })
    });
    const data = await res.json();
    if (data.success) { startTimer(); otpBoxes[0].focus(); }
    else showError(data.error || 'Could not resend OTP.');
  });

  /* Step dot hints on field focus */
  document.getElementById('shop_name').addEventListener('focus', () => {
    dot1.classList.add('active'); dot2.classList.remove('active'); dot3.classList.remove('active');
  });
  document.getElementById('name').addEventListener('focus', () => {
    dot1.classList.remove('active'); dot1.classList.add('done');
    dot2.classList.add('active'); dot3.classList.remove('active');
  });
  document.getElementById('phone').addEventListener('focus', () => {
    dot2.classList.remove('active'); dot2.classList.add('done');
    dot3.classList.add('active');
  });
</script>

</body>
</html>
